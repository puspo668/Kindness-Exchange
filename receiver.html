<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receiver Form</title>
  <link rel="stylesheet" type="text/css" href="recstyle.css">
</head>
<body>

  

  <!-- Form to enter receiver details and select donor -->
  <form action="receiver_submit.php" method="post">
    <h2>Book Receiver Form</h2>
    
    <label for="name">Your Name:</label>
    <input type="text" name="name" required>

    <!-- District Filter -->
    <label for="district">Select District:</label>
    <select name="district" id="district" required>
      <option value="">--Select District--</option>
      <option value="Dhaka">Dhaka</option>
      <option value="Chattogram">Chattogram</option>
      <option value="Khulna">Khulna</option>
      <option value="Rajshahi">Rajshahi</option>
      <option value="Barisal">Barisal</option>
      <option value="Sylhet">Sylhet</option>
      <option value="Rangpur">Rangpur</option>
      <option value="Mymensingh">Mymensingh</option>
    </select>
    <label for="address">Address:</label>
    <input type="text" name="address" required>

    <label for="phone">Phone:</label>
    <input type="tel" name="phone" pattern="[0-9]{11}" placeholder="e.g., 01XXXXXXXXX" required>

    <label for="email">Email:</label>
    <input type="email" name="email" placeholder="you@example.com" required>

    <!-- Donor selection dropdown -->
    <label for="donors_id">Select Donor:</label>
    <input type="number" name="donors_id" required>

    <button type="submit">Submit Request</button>
  </form>

</body>
</html>
