<!DOCTYPE html>
<html>

<head>
  <title>Registration Form</title>
  <!-- Link to the external CSS file -->
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

  <div class="form-container">
    <h2> Book Donation Registration</h2>
    <form action="register.php" method="POST">
      <label for="name">Full Name:</label>
      <input type="text" name="name" id="name" required>



      <label for="division">Division:</label>
      <select name="division" id="division" onchange="updateDistricts()" required>
        <option value="">-- Select Division --</option>
        <option value="Dhaka">Dhaka</option>
        <option value="Chattogram">Chattogram</option>
        <option value="Khulna">Khulna</option>
        <option value="Rajshahi">Rajshahi</option>
        <option value="Barisal">Barisal</option>
        <option value="Sylhet">Sylhet</option>
        <option value="Rangpur">Rangpur</option>
        <option value="Mymensingh">Mymensingh</option>
      </select>

      <label for="district">District:</label>
      <input type="text" name="district" id="district" required>

      <!-- Address -->
      <label for="address">Address:</label>
      <input type="text" id="address" name="address" required>

      <!-- Phone Number -->
      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" placeholder="e.g., 01XXXXXXXXX" required>

      <!-- Email -->
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label>Book Type:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="types[]" value="Academic"> Academic</label>
        <label><input type="checkbox" name="types[]" value="Fiction"> Fiction</label>
        <label><input type="checkbox" name="types[]" value="Non-Fiction"> Non-Fiction</label>
      </div>

      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" name="quantity" min="1" required>


      <button type="submit">Donate</button>
    </form>
  </div>

</body>

</html>
